{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <h1>Create Account</h1>
        
        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success" role="alert">
            {{ success }}
            <a href="{{ url_for('login') }}">Click here to login</a>
        </div>
        {% else %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Username:</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control"
                    required
                    minlength="3"
                >
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirm Password:</label>
                <input 
                    type="password" 
                    id="password_confirm" 
                    name="password_confirm" 
                    class="form-control"
                    required
                    minlength="6"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Register
            </button>
        </form>

        <p class="text-center mt-3">
            Already have an account? 
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

        {% endif %}
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
}

.auth-card {
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 420px;
    animation: slideUp 0.5s ease;
}

.auth-card h1 {
    margin-bottom: 30px;
    color: var(--dark);
    text-align: center;
    font-size: 28px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--dark);
    font-weight: 600;
    font-size: 14px;
}

.form-control {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    transition: var(--transition);
    font-family: inherit;
}

.form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    background: #f0f4ff;
}

.text-center {
    text-align: center;
    color: #64748b;
    margin-top: 20px;
    font-size: 14px;
}

.text-center a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
    transition: var(--transition);
}

.text-center a:hover {
    text-decoration: underline;
    color: var(--secondary);
}

.mt-3 {
    margin-top: 20px;
}

.alert {
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    border-left: 4px solid;
}

.alert a {
    color: inherit;
    font-weight: 600;
    text-decoration: underline;
}

/* Mobile Responsiveness */
@media (max-width: 480px) {
    .auth-card {
        padding: 30px 20px;
    }

    .auth-card h1 {
        font-size: 24px;
    }
}
</style>

{% endblock %}
