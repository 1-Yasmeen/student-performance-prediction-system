{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <h1>Reset Password</h1>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success" role="alert">
            {{ success }}
            <a href="{{ url_for('login') }}">Click here to login</a>
        </div>
        {% else %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6">
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
            </div>
        </form>

        <p class="text-center mt-3">
            Remembered your password? <a href="{{ url_for('login') }}">Login here</a>
        </p>

        {% endif %}
    </div>
</div>

<style>
/* small local styles for the forgot password page */
.auth-container { display:flex; justify-content:center; align-items:center; min-height: calc(100vh - 160px); }
.auth-card { max-width:520px; padding:36px; }
</style>

{% endblock %}
